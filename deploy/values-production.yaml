configmap:
  cors:
    allowOrigins:
      - "https://librechat.yourdomain.com"
      - "https://admin.yourdomain.com"
  mcpBackends:
    - name: ms365-teams
      host: m365.kindcoast-e367d61d.switzerlandnorth.azurecontainerapps.io
      port: 443
      path: /mcp
      protocol: StreamableHTTP
      tls:
        insecureSkipVerify: All

deployment:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
