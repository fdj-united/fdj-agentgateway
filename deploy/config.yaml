frontendPolicies:
  accessLog:
    add:
      mcp.tool: 'mcp.tool.name'
      mcp.target: 'mcp.tool.target'
      mcp.session: 'mcp.session.id'
      user: 'request.headers["X-User-Email"]'
      status: 'response.status_code'

binds:
# MCP server 1 — MS365 Teams (stable backend)
- port: 3001
  listeners:
  - routes:
    - policies:
        cors:
          allowOrigins:
          - http://localhost:3080
          - "*"
          allowHeaders:
          - mcp-protocol-version
          - content-type
          - cache-control
          - authorization
          exposeHeaders:
          - Mcp-Session-Id
        mcpAuthorization:
          rules:
          - 'mcp.tool.target == "ms365-teams"'
      backends:
      - mcp:
          targets:
          - name: ms365-teams
            mcp:
              host: https://m365.kindcoast-e367d61d.switzerlandnorth.azurecontainerapps.io/mcp
            policies:
              backendTLS:
                insecure: true

# MCP server 2 — MS365 Dev
- port: 3002
  listeners:
  - routes:
    - policies:
        cors:
          allowOrigins:
          - http://localhost:3080
          - "null"
          allowHeaders:
          - mcp-protocol-version
          - content-type
          - cache-control
          - authorization
          exposeHeaders:
          - Mcp-Session-Id
        mcpAuthorization:
          rules:
          - 'mcp.tool.name in ["get-chat", "list-chat-messages"]'
        mcpConfirmation:
          ttlSeconds: 120
          rules:
          - 'mcp.tool.name == "get-chat"'
        mcpRateLimit:
          maxCalls: 5
          windowSeconds: 60
          rules:
          - 'mcp.tool.name in ["get-chat", "list-chat-messages"]'
      backends:
      - mcp:
          targets:
          - name: ms365-dev
            mcp:
              host: https://ms365-mcp-dev.kindredgroup.com/mcp
            policies:
              backendTLS:
                insecure: true


# MCP server 3 — Atlassian Cloud (Confluence)
# No mcpAuthentication: the gateway transparently proxies Atlassian's OAuth
# flow (well-known endpoints, 401 challenges) so LibreChat can authenticate
# directly with Atlassian's authorization server.
- port: 3003
  listeners:
  - routes:
    - policies:
        cors:
          allowOrigins:
          - http://localhost:3080
          - "*"
          allowHeaders:
          - mcp-protocol-version
          - content-type
          - cache-control
          - authorization
          exposeHeaders:
          - Mcp-Session-Id
        mcpAuthorization:
          rules:
          - 'mcp.tool.name in ["createConfluenceFooterComment", "createConfluenceInlineComment", "createConfluencePage", "getConfluencePage", "getConfluencePageDescendants", "getConfluencePageFooterComments", "getConfluencePageInlineComments", "getConfluenceSpaces", "getPagesInConfluenceSpace", "searchConfluenceUsingCql", "updateConfluencePage"]'
      backends:
      - mcp:
          targets:
          - name: atlassian
            mcp:
              host: https://mcp.atlassian.com/v1/mcp
            policies:
              backendTLS:
                insecure: true
