image:
  registry: ""
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Deployment-level knobs.
deployment:
  name: kindred-mcp-gateway
  replicas: 1
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

service:
  name: kindred-mcp-gateway
  type: ClusterIP
  annotations: {}

ingress:
  enabled: false
  className: ""          
  annotations: {}         
  tls: []        

admin:
  enabled: false
  host: ""                
  sidecar:
    image: alpine/socat:1.7.4.4
    port: 15001
    resources: {}
  ingress:
    className: ""         
    annotations: {}       
    tls:
      enabled: false
      secretName: ""      

# Frontend policies applied to all requests through the proxy.
frontendPolicies:
  accessLog:
    mcp.tool: 'mcp.tool.name'
    mcp.target: 'mcp.tool.target'
    mcp.session: 'mcp.sessionId'
    mcp.method: 'mcp.methodName'
    user: 'request.headers["X-User-Email"]'
    status: 'response.status_code'

# Default CORS — applied to every listener that doesn't override it.
cors:
  allowOrigins: []
  allowHeaders: []
  allowMethods: []
  exposeHeaders: []

listeners: []
