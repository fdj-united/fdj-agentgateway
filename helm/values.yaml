image:
  registry: ""
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

gateway:
  name: agentgateway-proxy
  namespace: agentgateway
  gatewayClassName: agentgateway
  listener:
    name: http
    protocol: HTTP
    port: 80

cors:
  allowOrigins: []
  allowHeaders: []
  allowMethods: []
  exposeHeaders: []

backends: []

# Subchart: upstream agentgateway control plane
agentgateway:
  discoveryNamespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: agentgateway
