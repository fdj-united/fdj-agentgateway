# Custom proxy image (Kindred fork). Jenkins bakes these values in at
# package time via `sed`. They're read by templates/parameters.yaml.
image:
  registry: ""
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []


gateway:
  name: agentgateway-proxy
  gatewayClassName: agentgateway

# Frontend policies applied to all requests through the proxy.
frontendPolicies:
  accessLog:
    mcp.tool: 'mcp.tool.name'
    mcp.target: 'mcp.tool.target'
    mcp.method: 'mcp.methodName'
    mcp.session: 'mcp.sessionId'
    user: 'request.headers["X-User-Email"]'
    status: 'response.status_code'

cors:
  allowOrigins: []
  allowHeaders: []
  allowMethods: []
  exposeHeaders: []

listeners: []


agentgateway:
  discoveryNamespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: kindred-mcp-gateway
