{{- range .Values.backends }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-route
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .routePath }}
      backendRefs:
        - name: {{ .name }}-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
{{- end }}
