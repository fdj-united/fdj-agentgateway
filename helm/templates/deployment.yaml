apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.name }}
        {{- with .Values.deployment.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.deployment.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: agentgateway
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-f", "/etc/agentgateway/config.yaml"]
          {{- $hasSessionKey := and .Values.deployment.sessionKeySecret .Values.deployment.sessionKeySecret.name }}
          {{- if or $hasSessionKey .Values.redis.enabled }}
          env:
            {{- if $hasSessionKey }}
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.deployment.sessionKeySecret.name }}
                  key: {{ .Values.deployment.sessionKeySecret.key | default "SESSION_KEY" | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            # In-namespace Redis subchart — Bitnami's `standalone` architecture
            # exposes one Service named `<release>-redis-master`. URL is not
            # sensitive (no Redis auth, NetworkPolicy is the boundary), so it
            # lives in values.yaml rather than a SealedSecret.
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis-master.{{ .Release.Namespace }}.svc.cluster.local:6379/0"
            - name: STATE_STORE_FAILURE_MODE
              value: {{ .Values.stateStore.failureMode | default "failClosed" | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.deployment.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- range .Values.listeners }}
            - name: {{ .name | trunc 15 }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway/config.yaml
              subPath: config.yaml
              readOnly: true
        {{- if and .Values.admin .Values.admin.enabled }}
        - name: oauth2-proxy
          image: {{ .Values.admin.oauth2Proxy.image | quote }}
          args:
            - --provider=oidc
            - --provider-display-name=Microsoft Entra ID
            - --oidc-issuer-url={{ required "admin.oauth2Proxy.issuerUrl is required when admin.enabled is true" .Values.admin.oauth2Proxy.issuerUrl }}
            - --client-id={{ required "admin.oauth2Proxy.clientId is required when admin.enabled is true" .Values.admin.oauth2Proxy.clientId }}
            - --redirect-url=https://{{ required "admin.host is required when admin.enabled is true" .Values.admin.host }}/oauth2/callback
            - --upstream=http://127.0.0.1:15000
            - --http-address=0.0.0.0:{{ .Values.admin.oauth2Proxy.port }}
            - --email-domain={{ .Values.admin.oauth2Proxy.emailDomain | default "*" }}
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --cookie-secure={{ .Values.admin.oauth2Proxy.cookieSecure }}
            {{- with .Values.admin.oauth2Proxy.cookieDomain }}
            - --cookie-domain={{ . }}
            - --whitelist-domain={{ . }}
            {{- end }}
            - --scope={{ .Values.admin.oauth2Proxy.scope }}
            {{- range .Values.admin.oauth2Proxy.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "admin.oauth2Proxy.existingSecretName is required when admin.enabled is true" .Values.admin.oauth2Proxy.existingSecretName }}
                  key: {{ .Values.admin.oauth2Proxy.secretKeys.clientSecret | quote }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.oauth2Proxy.existingSecretName }}
                  key: {{ .Values.admin.oauth2Proxy.secretKeys.cookieSecret | quote }}
          ports:
            - name: oauth2-proxy
              containerPort: {{ .Values.admin.oauth2Proxy.port }}
              protocol: TCP
          {{- with .Values.admin.oauth2Proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.deployment.name }}-config
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
