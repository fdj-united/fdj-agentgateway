{{- range .Values.backends }}
{{- if .authorization }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ .name }}-authz
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .name }}-route
  backend:
    mcp:
      authorization:
        policy:
          matchExpressions:
            {{- range .authorization.matchExpressions }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
{{- if .rateLimit }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ .name }}-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .name }}-route
  traffic:
    rateLimit:
      local:
        - requests: {{ .rateLimit.requests }}
          unit: {{ .rateLimit.unit }}
{{- end }}
{{- end }}
