apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    {{- range .Values.listeners }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: {{ .protocol | default "HTTP" }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
