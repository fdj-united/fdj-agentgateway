name: Build image (validation only)

# Production releases go through Jenkins (Jenkinsfile at the repo root), which
# builds + pushes to jfrog.kindredgroup.com/docker-dev/kindred/dde/agentgateway
# and publishes the helm chart from helm/.
#
# This workflow exists for fast PR sanity-checks: it builds the same Dockerfile
# on GitHub-hosted runners and exercises the cache, but pushes nowhere. Use the
# `workflow_dispatch` input to opt into a GHCR publish when you specifically
# need an image at ghcr.io (e.g. for an upstream contribution).

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'crates/**'
      - 'common/**'
      - 'controller/**'
      - 'ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.1.0-fdj.1). When set, the build is pushed to GHCR.'
        required: false
        type: string

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/agentgateway

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # GHCR login only runs when this is a manual dispatch with a version set.
    - name: Login to GitHub Container Registry
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build (and conditionally push to GHCR)
      uses: docker/build-push-action@v6
      with:
        push: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        platforms: linux/amd64
        tags: |
          ${{ env.REGISTRY_IMAGE }}:${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('v{0}', inputs.version) || format('pr-{0}', github.event.pull_request.number || github.run_id) }}
        build-args: |
          VERSION=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version || format('pr-{0}-{1}', github.event.pull_request.number || github.run_id, github.sha) }}
          GIT_REVISION=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
